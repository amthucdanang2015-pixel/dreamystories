  <g stroke="#4E7344" stroke-width="4" stroke-linecap="round">
    <path d="M30 230 q-4 -60 6 -100"/><path d="M44 236 q2 -50 -8 -84"/><path d="M326 228 q4 -54 -6 -92"/><path d="M314 236 q-2 -46 8 -78"/>
