  <g transform="translate(286 286)"><ellipse cx="0" cy="0" rx="12" ry="8" fill="#F2C94C"/><circle cx="-9" cy="-9" r="6" fill="#F2C94C"/><path d="M-14 -9 l-6 2 l6 2 z" fill="#E08A2E"/><circle cx="-10" cy="-11" r="1.3" fill="#2A3640"/></g>
