  <g transform="translate(180 236)">
    <ellipse cx="0" cy="12" rx="62" ry="26" fill="#FFFFFF"/>
    <path d="M-50 6 Q-70 -24 -40 -18 Q-20 -10 -6 6 Z" fill="#F1F4F6"/>
    <path d="M36 4 Q50 -10 44 -40 Q40 -66 58 -72 Q76 -74 76 -58" stroke="#FFFFFF" stroke-width="16" fill="none" stroke-linecap="round"/>
