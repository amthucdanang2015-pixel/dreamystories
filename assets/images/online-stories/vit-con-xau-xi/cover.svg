<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 360 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFD9E8"/><stop offset="1" stop-color="#E6F1F2"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FB3C9"/><stop offset="1" stop-color="#4F8AA3"/></linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75"><stop offset="0.6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.22"/></radialGradient>
  </defs>
  <rect width="360" height="360" fill="url(#sky)"/>
  <circle cx="290" cy="70" r="26" fill="#FFF6D8"/>
  <path d="M0 170 Q90 140 180 160 T360 150 V200 H0 Z" fill="#7FA66A"/>
  <rect y="190" width="360" height="170" fill="url(#water)"/>
